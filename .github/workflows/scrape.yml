name: Scrape CLN Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        env:
          ALSO_ENERGY_USERNAME: ${{ secrets.ALSO_ENERGY_USERNAME }}
          ALSO_ENERGY_PASSWORD: ${{ secrets.ALSO_ENERGY_PASSWORD }}
        run: node scraper.js

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/history.json
          git diff --staged --quiet || git commit -m "Update solar data [skip ci]"
          git push
