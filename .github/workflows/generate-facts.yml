name: Generate Solar Facts

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC (midnight MDT)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate facts via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate-facts.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/facts.json
          git diff --staged --quiet || (git commit -m "chore: refresh AI-generated solar facts" && git push)
